name: adp_mobile
description: Association Djerba Project mobile application.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4  # native only (iOS/Android); web uses in-memory fallback via conditional import
  shared_preferences: ^2.5.2
  qr_flutter: ^4.1.0
  intl: ^0.20.2
  app_links: ^6.4.1
  connectivity_plus: ^6.1.4
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/

<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="ADP — Association Djerba Project. Réseau mondial de la diaspora djerbienne : adhésion, dons, projets, bénévolat, investissement, événements et networking.">
  <meta name="theme-color" content="#0E2129">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ADP">
  <meta name="format-detection" content="telephone=no">

  <!-- iOS App Icon -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/Icon-512.png">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <title>ADP — Association Djerba Project</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 15%, #18222B 0%, #0C1014 100%);
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    /* Loading splash — shown until Flutter boots */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 15%, #18222B 0%, #0C1014 100%);
      z-index: 9999;
      transition: opacity 300ms ease;
    }
    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #splash .logo {
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: #0E2129;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.3);
    }
    #splash .logo svg {
      width: 56px;
      height: 56px;
    }
    #splash .app-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 28px;
      font-weight: 900;
      color: #D5AB72;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }
    #splash .tagline {
      font-size: 11px;
      color: #687B82;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    /* Flutter container */
    #flutter_target {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <!-- Loading splash screen (mirrors the Flutter splash) -->
  <div id="splash" aria-hidden="true">
    <div class="logo">
      <svg viewBox="0 0 100 100" fill="none">
        <circle cx="50" cy="50" r="40" fill="#F7EFE4" stroke="#EADBCE" stroke-width="2"/>
        <circle cx="50" cy="50" r="36" stroke="#0E2129" stroke-width="1" opacity="0.3"/>
        <path d="M 30 82 L 30 46 A 20 20 0 0 1 70 46 L 70 82 Z" fill="#0E2129"/>
        <circle cx="50" cy="54" r="8" fill="#D5AB72"/>
        <path d="M 30 64 L 70 64 L 70 82 L 30 82 Z" fill="#0D6274"/>
        <circle cx="50" cy="38" r="3" fill="#D46238"/>
        <rect x="38" y="30" width="4" height="16" fill="#0E2129"/>
        <rect x="58" y="30" width="4" height="16" fill="#0E2129"/>
      </svg>
    </div>
    <div class="app-name">DJERBA PROJECT</div>
    <div class="tagline">Association Djerba Project</div>
  </div>

  <div id="flutter_target"></div>

  <script>
    // Preloader: hide splash once Flutter is ready
    window.addEventListener('load', () => {
      setTimeout(() => {
        const splash = document.getElementById('splash');
        if (splash) splash.classList.add('hidden');
      }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
